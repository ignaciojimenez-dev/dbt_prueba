name: 'mi_proyecto_tpch'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

# ----------------------------------------------------------------
# CONFIGURACIÓN DE MODELOS (Materialización y Permisos)
# ----------------------------------------------------------------
models:
  mi_proyecto_tpch:
    
    # 1. STAGING (Vistas, datos crudos)
    staging:
      +materialized: view
      +schema: staging
      tpch:
        +tags: ["source_layer"]

    # 2. INTERMEDIATE (Lógica de negocio)
    intermediate:
      +materialized: view
      +schema: intermediate

    # 3. MARTS (Tablas finales para consumo)
    marts:
      +materialized: table
      +schema: marts
      # Cada vez que dbt cree estas tablas, dará permiso de lectura a todo el mundo.
      +grants:
        select: ['PUBLIC'] 
      
      main:
        +tags: ["domain_sales"]
      finance:
        +tags: ["domain_finance"]

# ----------------------------------------------------------------
# CONFIGURACIÓN DE TESTS 
# ----------------------------------------------------------------
# Aquí definimos el comportamiento de los tests según la carpeta donde estén
tests:
  mi_proyecto_tpch:
    
    # Tests de Staging: Si fallan, solo avisan (Warn).
    staging:
      +severity: warn
      +store_failures: true # Guarda las filas erróneas en la BBDD para auditar
      +tags: ["quality_raw"]

    # Tests de Marts: Si fallan, detienen todo 
    marts:
      +severity: error
      +tags: ["quality_business"]